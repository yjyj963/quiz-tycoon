<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>골드 퀘스트 (Blooket Style)</title>
  <style>
    :root {
      --bg: #1e1b4b;
      --panel: #2e1065;
      --card-bg: #3b0764;
      --gold: #fbbf24;
      --gold-dark: #d97706;
      --accent: #a855f7;
      --accent-glow: rgba(168, 85, 247, 0.4);
      --success: #22c55e;
      --danger: #ef4444;
      --text: #ffffff;
      --text-muted: #cbd5e1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      user-select: none;
    }

    body {
      background: radial-gradient(circle at center, #312e81, #0f172a);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
      overflow-x: hidden;
    }

    /* Top Nav */
    .top-bar {
      width: 100%;
      max-width: 850px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .title {
      font-size: 1.4rem;
      font-weight: 900;
      color: var(--gold);
      text-shadow: 0 0 10px rgba(251, 191, 36, 0.5);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-admin {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: var(--text);
      padding: 8px 14px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      backdrop-filter: blur(5px);
      transition: all 0.2s;
    }

    .btn-admin:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .main-layout {
      width: 100%;
      max-width: 850px;
      display: grid;
      grid-template-columns: 2.2fr 1fr;
      gap: 16px;
    }

    /* 왼쪽 게임 플레이 구역 */
    .game-area {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* 내 골드 전광판 */
    .gold-hud {
      background: linear-gradient(135deg, #4c1d95, #2e1065);
      border: 2px solid var(--gold);
      border-radius: 16px;
      padding: 18px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 8px 25px rgba(0,0,0,0.4);
    }

    .hud-player {
      display: flex;
      flex-direction: column;
    }

    .hud-player span:first-child {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .hud-player span:last-child {
      font-size: 1.2rem;
      font-weight: 800;
      color: #38bdf8;
    }

    .hud-gold-display {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .hud-gold-icon {
      font-size: 2rem;
      filter: drop-shadow(0 0 8px var(--gold));
    }

    .hud-gold-value {
      font-size: 2.2rem;
      font-weight: 900;
      color: var(--gold);
      text-shadow: 0 0 15px rgba(251, 191, 36, 0.5);
    }

    /* 화면 전환용 컨테이너 */
    .screen-container {
      background: rgba(23, 15, 48, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      min-height: 380px;
      padding: 24px;
      position: relative;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    /* 1. 퀴즈 뷰 */
    .quiz-view {
      display: flex;
      flex-direction: column;
      gap: 20px;
      width: 100%;
    }

    .q-badge {
      align-self: flex-start;
      background: rgba(168, 85, 247, 0.2);
      border: 1px solid var(--accent);
      color: #e9d5ff;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 12px;
    }

    .q-text {
      font-size: 1.25rem;
      font-weight: 700;
      line-height: 1.5;
      min-height: 60px;
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .btn-opt {
      background: #1e1b4b;
      border: 2px solid #4338ca;
      color: white;
      padding: 18px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      text-align: left;
      transition: all 0.15s ease;
    }

    .btn-opt:hover:not(:disabled) {
      background: #312e81;
      border-color: var(--accent);
      transform: translateY(-2px);
    }

    .btn-opt.correct {
      background: rgba(34, 197, 94, 0.3) !important;
      border-color: var(--success) !important;
    }

    .btn-opt.wrong {
      background: rgba(239, 68, 68, 0.3) !important;
      border-color: var(--danger) !important;
    }

    /* 2. 상자 선택 뷰 (Chest Pick) */
    .chest-view {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      animation: fadeIn 0.3s ease;
    }

    .chest-instruction {
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--gold);
      text-shadow: 0 0 10px rgba(251, 191, 36, 0.4);
    }

    .chests-row {
      display: flex;
      justify-content: center;
      gap: 20px;
      width: 100%;
    }

    .chest-box {
      width: 140px;
      height: 150px;
      background: linear-gradient(145deg, #6b21a8, #3b0764);
      border: 3px solid var(--gold);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .chest-box:hover {
      transform: translateY(-8px) scale(1.05);
      border-color: #fff;
      box-shadow: 0 12px 25px rgba(251, 191, 36, 0.4);
    }

    .chest-icon {
      font-size: 3.5rem;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
    }

    .chest-label {
      font-size: 0.85rem;
      font-weight: 700;
      margin-top: 6px;
      color: var(--gold);
    }

    /* 3. 보상 발표 뷰 (Chest Result) */
    .result-view {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      animation: popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      text-align: center;
    }

    .result-icon {
      font-size: 4.5rem;
      animation: bounce 0.6s infinite alternate ease-in-out;
    }

    .result-title {
      font-size: 2rem;
      font-weight: 900;
      color: var(--gold);
      text-shadow: 0 0 15px rgba(251, 191, 36, 0.6);
    }

    .result-desc {
      font-size: 1rem;
      color: var(--text-muted);
    }

    .btn-continue {
      margin-top: 10px;
      background: linear-gradient(135deg, #eab308, #ca8a04);
      color: #0f172a;
      border: none;
      padding: 12px 36px;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(234, 179, 8, 0.4);
      transition: all 0.2s;
    }

    .btn-continue:hover {
      transform: scale(1.05);
      background: linear-gradient(135deg, #facc15, #eab308);
    }

    /* 오른쪽 리더보드 */
    .leaderboard-card {
      background: rgba(23, 15, 48, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .lb-header {
      font-size: 1rem;
      font-weight: 800;
      color: var(--gold);
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 10px;
    }

    .lb-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .lb-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.05);
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      transition: all 0.2s;
    }

    .lb-item.me {
      background: linear-gradient(90deg, rgba(168, 85, 247, 0.3), rgba(59, 130, 246, 0.3));
      border: 1px solid var(--accent);
      font-weight: 800;
    }

    .lb-rank {
      width: 24px;
      font-weight: 900;
      color: var(--text-muted);
    }

    .lb-item:first-child .lb-rank { color: #f59e0b; }
    .lb-item:nth-child(2) .lb-rank { color: #cbd5e1; }
    .lb-item:nth-child(3) .lb-rank { color: #b45309; }

    .lb-name {
      flex: 1;
      text-align: left;
      padding-left: 8px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .lb-score {
      font-weight: 800;
      color: var(--gold);
    }

    /* 교사용 모달 */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(5px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 100;
      padding: 16px;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-card {
      background: #1e1b4b;
      border: 1px solid #4338ca;
      border-radius: 16px;
      width: 100%;
      max-width: 600px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid #4338ca;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-body {
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .form-group label {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .form-input {
      background: #0f172a;
      border: 1px solid #334155;
      color: white;
      padding: 10px;
      border-radius: 8px;
      font-size: 0.9rem;
    }

    .btn-submit {
      background: var(--success);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-sub {
      background: #334155;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-size: 0.85rem;
      cursor: pointer;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.7); }
      70% { transform: scale(1.08); }
      100% { opacity: 1; transform: scale(1); }
    }

    @keyframes bounce {
      from { transform: translateY(0); }
      to { transform: translateY(-10px); }
    }

    @media (max-width: 720px) {
      .main-layout { grid-template-columns: 1fr; }
      .options-grid { grid-template-columns: 1fr; }
      .chest-box { width: 95px; height: 120px; }
      .chest-icon { font-size: 2.5rem; }
    }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <div class="top-bar">
    <div class="title">🏆 골드 퀘스트 (Gold Quest)</div>
    <button class="btn-admin" onclick="openAdminModal()">⚙️ 문제 관리자</button>
  </div>

  <div class="main-layout">
    <!-- 왼쪽 게임 구역 -->
    <div class="game-area">
      <!-- 골드 전광판 -->
      <div class="gold-hud">
        <div class="hud-player">
          <span>PLAYER</span>
          <span>나 (탐험가)</span>
        </div>
        <div class="hud-gold-display">
          <div class="hud-gold-icon">💰</div>
          <div class="hud-gold-value" id="player-gold">0</div>
        </div>
      </div>

      <!-- 메인 스크린 (퀴즈 / 상자 / 결과 3단계 교체) -->
      <div class="screen-container">
        <!-- 1. 퀴즈 화면 -->
        <div class="quiz-view" id="view-quiz">
          <div class="q-badge" id="q-category">생명과학 미션</div>
          <div class="q-text" id="q-text">문제를 불러오는 중...</div>
          <div class="options-grid" id="options-container"></div>
        </div>

        <!-- 2. 상자 선택 화면 -->
        <div class="chest-view" id="view-chest">
          <div class="chest-instruction">🎁 행운의 상자 하나를 선택하세요!</div>
          <div class="chests-row">
            <div class="chest-box" onclick="pickChest(0)">
              <div class="chest-icon">📦</div>
              <div class="chest-label">상자 #1</div>
            </div>
            <div class="chest-box" onclick="pickChest(1)">
              <div class="chest-icon">📦</div>
              <div class="chest-label">상자 #2</div>
            </div>
            <div class="chest-box" onclick="pickChest(2)">
              <div class="chest-icon">📦</div>
              <div class="chest-label">상자 #3</div>
            </div>
          </div>
        </div>

        <!-- 3. 상자 개봉 결과 화면 -->
        <div class="result-view" id="view-result">
          <div class="result-icon" id="res-icon">✨</div>
          <div class="result-title" id="res-title">+50 Gold!</div>
          <div class="result-desc" id="res-desc">상자에서 금화를 발견했습니다!</div>
          <button class="btn-continue" onclick="nextQuestion()">계속하기 ➔</button>
        </div>
      </div>
    </div>

    <!-- 오른쪽 실시간 랭킹 (라이벌 봇들과 경쟁) -->
    <div class="leaderboard-card">
      <div class="lb-header">
        <span>🏆 순위표 (Leaderboard)</span>
        <span style="font-size: 0.8rem; color: var(--text-muted);">실시간</span>
      </div>
      <div class="lb-list" id="lb-list"></div>
    </div>
  </div>

  <!-- 교사용 문제 관리 모달 -->
  <div class="modal-overlay" id="admin-modal">
    <div class="modal-card">
      <div class="modal-header">
        <h3 style="color: var(--gold);">⚙️ 문제 관리 센터</h3>
        <button onclick="closeAdminModal()" style="background:transparent; border:none; color:white; font-size:1.5rem; cursor:pointer;">&times;</button>
      </div>
      <div class="modal-body">
        <form onsubmit="handleAddNewQuestion(event)" style="display:flex; flex-direction:column; gap:10px;">
          <div class="form-group">
            <label>문제 발문</label>
            <input type="text" class="form-input" id="in-q" placeholder="예: 광합성이 일어나는 세포 소기관은?" required />
          </div>
          <div class="form-group">
            <label>정답 (자동 셔플됩니다)</label>
            <input type="text" class="form-input" id="in-ans" placeholder="예: 엽록체" required />
          </div>
          <div class="form-group">
            <label>오답 1</label>
            <input type="text" class="form-input" id="in-w1" placeholder="예: 미토콘드리아" required />
          </div>
          <div class="form-group">
            <label>오답 2</label>
            <input type="text" class="form-input" id="in-w2" placeholder="예: 리보솜" required />
          </div>
          <div class="form-group">
            <label>오답 3</label>
            <input type="text" class="form-input" id="in-w3" placeholder="예: 골지체" required />
          </div>
          <button type="submit" class="btn-submit">➕ 문제 풀에 추가하기</button>
        </form>

        <div style="display:flex; gap:10px; padding-top:10px; border-top:1px solid #4338ca;">
          <button class="btn-sub" style="flex:1;" onclick="exportQuestionsJSON()">📥 문제 내보내기 (.json)</button>
          <button class="btn-sub" style="flex:1;" onclick="document.getElementById('file-in').click()">📤 문제 불러오기 (.json)</button>
          <input type="file" id="file-in" style="display:none;" accept=".json" onchange="importQuestionsJSON(event)" />
        </div>

        <div style="margin-top:10px;">
          <h4 style="font-size:0.85rem; margin-bottom:8px;">등록된 문제 (<span id="q-count">0</span>개)</h4>
          <div id="q-list" style="display:flex; flex-direction:column; gap:6px; max-height:160px; overflow-y:auto;"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // 기본 탑재 생명과학 문제 풀
    const defaultQuestions = [
      {
        q: "식물 세포에서 빛 에너지를 흡수하여 광합성을 수행하는 세포 소기관은?",
        options: ["엽록체", "미토콘드리아", "리보솜", "골지체"],
        answer: 0
      },
      {
        q: "유기물을 분해하여 생명 활동에 필요한 ATP를 주로 생성하는 소기관은?",
        options: ["미토콘드리아", "소포체", "중심체", "리소좀"],
        answer: 0
      },
      {
        q: "mRNA의 유전 정보를 바탕으로 단백질을 직접 합성하는 세포 내 구조는?",
        options: ["리보솜", "액포", "세포벽", "핵소체"],
        answer: 0
      },
      {
        q: "동물 세포의 세포 분열 시 방추사를 형성하는 데 관여하는 소기관은?",
        options: ["중심체", "엽록체", "골지체", "소포체"],
        answer: 0
      },
      {
        q: "가수 분해 효소가 들어 있어 세포 내 소화 및 이물질 분해를 담당하는 소기관은?",
        options: ["리소좀", "리보솜", "핵", "미토콘드리아"],
        answer: 0
      }
    ];

    let questions = [];
    let myGold = 0;
    let currentQ = null;

    // 가상 라이벌 봇들 (블루킷처럼 골드 경쟁)
    let players = [
      { name: "나 (탐험가)", gold: 0, isMe: true },
      { name: "호기심많은여우", gold: 50, isMe: false },
      { name: "열정적인판다", gold: 120, isMe: false },
      { name: "우주비행사곰", gold: 30, isMe: false },
      { name: "달리는부엉이", gold: 80, isMe: false }
    ];

    // 효과음 생성기 (AudioContext)
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playTone(freq, type, duration) {
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch(e) {}
    }

    // 봇들의 자동 활동 (1.5초마다 가끔 문제 맞춰서 골드 변화)
    setInterval(() => {
      const bot = players[Math.floor(Math.random() * (players.length - 1)) + 1];
      const delta = Math.floor(Math.random() * 40) + 10;
      bot.gold += delta;
      renderLeaderboard();
    }, 2000);

    function init() {
      const saved = localStorage.getItem('gold_quest_questions');
      if (saved) {
        try { questions = JSON.parse(saved); } catch(e) { questions = [...defaultQuestions]; }
      } else {
        questions = [...defaultQuestions];
      }

      loadQuestion();
      renderLeaderboard();
      renderAdminList();
    }

    function renderLeaderboard() {
      // 내 점수 동기화
      const me = players.find(p => p.isMe);
      me.gold = myGold;

      // 골드 높은 순 정렬
      players.sort((a, b) => b.gold - a.gold);

      const listEl = document.getElementById('lb-list');
      listEl.innerHTML = '';

      players.forEach((p, idx) => {
        const item = document.createElement('div');
        item.className = `lb-item ${p.isMe ? 'me' : ''}`;
        item.innerHTML = `
          <span class="lb-rank">#${idx + 1}</span>
          <span class="lb-name">${p.name}</span>
          <span class="lb-score">${p.gold.toLocaleString()} G</span>
        `;
        listEl.appendChild(item);
      });
    }

    // 1. 문제 출제
    function loadQuestion() {
      document.getElementById('view-quiz').style.display = 'flex';
      document.getElementById('view-chest').style.display = 'none';
      document.getElementById('view-result').style.display = 'none';

      if (questions.length === 0) {
        document.getElementById('q-text').textContent = "문제가 없습니다. 관리자 모드에서 추가해주세요!";
        document.getElementById('options-container').innerHTML = '';
        return;
      }

      currentQ = questions[Math.floor(Math.random() * questions.length)];
      document.getElementById('q-text').textContent = currentQ.q;
      const optContainer = document.getElementById('options-container');
      optContainer.innerHTML = '';

      const shuffled = currentQ.options
        .map((text, idx) => ({ text, isCorrect: idx === currentQ.answer }))
        .sort(() => Math.random() - 0.5);

      shuffled.forEach(item => {
        const btn = document.createElement('button');
        btn.className = 'btn-opt';
        btn.textContent = item.text;
        btn.onclick = () => handleAnswer(item.isCorrect, btn);
        optContainer.appendChild(btn);
      });
    }

    // 2. 답안 검증
    function handleAnswer(isCorrect, btn) {
      const allBtns = document.querySelectorAll('.btn-opt');
      allBtns.forEach(b => b.disabled = true);

      if (isCorrect) {
        btn.classList.add('correct');
        playTone(523.25, 'triangle', 0.1);
        setTimeout(() => playTone(659.25, 'sine', 0.15), 80);
        setTimeout(() => playTone(783.99, 'sine', 0.25), 160);

        // 정답 시 상자 선택 화면으로 전환
        setTimeout(() => {
          document.getElementById('view-quiz').style.display = 'none';
          document.getElementById('view-chest').style.display = 'flex';
        }, 600);
      } else {
        btn.classList.add('wrong');
        playTone(220, 'sawtooth', 0.3);
        // 오답 시 잠시 후 다음 문제로
        setTimeout(loadQuestion, 800);
      }
    }

    // 3. 블루킷 골드 퀘스트 확률 테이블
    function pickChest(chestIndex) {
      playTone(400, 'sine', 0.1);
      setTimeout(() => playTone(800, 'sine', 0.2), 100);

      const roll = Math.random();
      let result = { icon: "💰", title: "+50 Gold", desc: "상자에서 금화를 발견했습니다!" };

      // 라이벌 봇 중 1등 찾기 (나 제외)
      const opponents = players.filter(p => !p.isMe);
      const topOpponent = opponents.sort((a,b) => b.gold - a.gold)[0];

      if (roll < 0.30) {
        // 일반 골드 +30~80
        const gain = Math.floor(Math.random() * 50) + 30;
        myGold += gain;
        result = { icon: "💰", title: `+${gain} Gold!`, desc: "상자에서 금화 더미를 발견했습니다!" };
      } else if (roll < 0.50) {
        // 대박 골드 +100~250
        const gain = Math.floor(Math.random() * 150) + 100;
        myGold += gain;
        result = { icon: "💎", title: `+${gain} Gold!!`, desc: "희귀한 대형 보물 상자였습니다!" };
      } else if (roll < 0.65) {
        // 1.5배 또는 2배 뻥튀기
        const mult = Math.random() < 0.6 ? 1.5 : 2.0;
        const before = myGold;
        myGold = Math.floor(myGold * mult);
        const diff = myGold - before;
        result = { icon: "⚡", title: `x${mult} 배수 보너스!`, desc: `보유 골드가 뻥튀기되었습니다! (+${diff} G)` };
      } else if (roll < 0.80 && topOpponent && topOpponent.gold > 20) {
        // 상대 20% 스틸 (Steal 20%)
        const stolen = Math.floor(topOpponent.gold * 0.25);
        topOpponent.gold -= stolen;
        myGold += stolen;
        result = { icon: "🦹", title: `골드 스틸 (+${stolen} G)`, desc: `'${topOpponent.name}' 님의 골드를 빼앗아왔습니다!` };
      } else if (roll < 0.90 && topOpponent && topOpponent.gold > myGold) {
        // 골드 스왑 (SWAP)
        const temp = myGold;
        myGold = topOpponent.gold;
        topOpponent.gold = temp;
        result = { icon: "🔄", title: "골드 SWAP!!", desc: `1등인 '${topOpponent.name}' 님과 골드를 맞바꿨습니다!` };
      } else if (roll < 0.95 && myGold > 30) {
        // 25% 손실 함정
        const loss = Math.floor(myGold * 0.25);
        myGold -= loss;
        result = { icon: "💣", title: `함정 폭탄! (-${loss} G)`, desc: "상자 속 폭탄이 터져 골드를 잃었습니다." };
      } else {
        // 꽝
        result = { icon: "💨", title: "꽝! (텅 빈 상자)", desc: "상자가 비어 있었습니다. 아쉽네요!" };
      }

      // 화면에 결과 표시
      document.getElementById('player-gold').textContent = myGold.toLocaleString();
      document.getElementById('res-icon').textContent = result.icon;
      document.getElementById('res-title').textContent = result.title;
      document.getElementById('res-desc').textContent = result.desc;

      document.getElementById('view-chest').style.display = 'none';
      document.getElementById('view-result').style.display = 'flex';

      renderLeaderboard();
    }

    function nextQuestion() {
      loadQuestion();
    }

    // 관리자 모달 함수들
    function openAdminModal() {
      document.getElementById('admin-modal').classList.add('active');
    }

    function closeAdminModal() {
      document.getElementById('admin-modal').classList.remove('active');
    }

    function renderAdminList() {
      document.getElementById('q-count').textContent = questions.length;
      const list = document.getElementById('q-list');
      list.innerHTML = '';

      questions.forEach((q, idx) => {
        const item = document.createElement('div');
        item.style.cssText = "background:#0f172a; padding:8px 12px; border-radius:6px; display:flex; justify-content:space-between; align-items:center; font-size:0.85rem;";
        item.innerHTML = `
          <span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:80%;">#${idx+1} ${q.q}</span>
          <button onclick="deleteQuestion(${idx})" style="background:transparent; border:none; color:var(--danger); cursor:pointer; font-weight:bold;">삭제</button>
        `;
        list.appendChild(item);
      });
    }

    function handleAddNewQuestion(e) {
      e.preventDefault();
      const q = document.getElementById('in-q').value.trim();
      const ans = document.getElementById('in-ans').value.trim();
      const w1 = document.getElementById('in-w1').value.trim();
      const w2 = document.getElementById('in-w2').value.trim();
      const w3 = document.getElementById('in-w3').value.trim();

      questions.push({
        q: q,
        options: [ans, w1, w2, w3],
        answer: 0
      });

      localStorage.setItem('gold_quest_questions', JSON.stringify(questions));
      e.target.reset();
      renderAdminList();
      alert("문제가 성공적으로 등록되었습니다!");
    }

    function deleteQuestion(idx) {
      if (confirm("이 문제를 삭제하시겠습니까?")) {
        questions.splice(idx, 1);
        localStorage.setItem('gold_quest_questions', JSON.stringify(questions));
        renderAdminList();
        loadQuestion();
      }
    }

    function exportQuestionsJSON() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(questions, null, 2));
      const dlAnchor = document.createElement('a');
      dlAnchor.setAttribute("href", dataStr);
      dlAnchor.setAttribute("download", "gold_quest_questions.json");
      dlAnchor.click();
    }

    function importQuestionsJSON(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        try {
          const imported = JSON.parse(evt.target.result);
          if (Array.isArray(imported)) {
            questions = imported;
            localStorage.setItem('gold_quest_questions', JSON.stringify(questions));
            renderAdminList();
            loadQuestion();
            alert("문제를 성공적으로 불러왔습니다!");
          }
        } catch(err) {
          alert("유효한 JSON 파일 형식이 아닙니다.");
        }
      };
      reader.readAsText(file);
    }

    window.onload = init;
  </script>
</body>
